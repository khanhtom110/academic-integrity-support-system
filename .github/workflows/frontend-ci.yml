name: CI_FE

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'frontend/**'
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - dev
      - main
    paths:
      - 'frontend/**'

jobs:
  build:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Code Formatting & Lint
        run: npm run lint

      - name: Compile and Build
        run: npm run build