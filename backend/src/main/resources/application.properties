spring.application.name=lms

server.port=${SERVER_PORT:8080}

# Database Configurations
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

security.swagger-endpoints=/swagger-ui/**,/v3/api-docs/**,/swagger-ui.html
security.public-endpoints=/api/v1/auth/**,/api/v1/public/**
security.user-endpoints=/api/v1/user/**
security.admin-endpoints=/api/v1/admin/**

jwt.secret=${JWT_SECRET}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}

# ==========================================
# GOOGLE OAUTH2 CONFIGURATION
# ==========================================
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI}
app.oauth2.google.token-uri=https://oauth2.googleapis.com/token
app.oauth2.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo