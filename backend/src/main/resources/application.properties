spring.application.name=lms

server.port=${SERVER_PORT:8080}

jwt.access.expiration_time=${ACCESS_EXPIRATION_TIME}
jwt.refresh.expiration_time=${REFRESH_EXPIRATION_TIME}

# Database Configurations
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

security.swagger-endpoints=/swagger-ui/**,/v3/api-docs/**,/swagger-ui.html
security.public-endpoints=/api/v1/auth/**,/api/v1/public/**
security.user-endpoints=/api/v1/user/**
security.admin-endpoints=/api/v1/admin/**

jwt.secret=${JWT_SECRET}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}

# ==========================================
# GOOGLE OAUTH2 CONFIGURATION
# ==========================================
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI}
app.oauth2.google.token-uri=https://oauth2.googleapis.com/token
app.oauth2.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# ==========================================
# FACEBOOK OAUTH2 CONFIGURATION
# ==========================================
app.oauth2.facebook.client-id=${FACEBOOK_CLIENT_ID}
app.oauth2.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
app.oauth2.facebook.redirect-uri=${FACEBOOK_REDIRECT_URI}
app.oauth2.facebook.token-uri=${FACEBOOK_TOKEN_URI}
app.oauth2.facebook.user-info-uri=${FACEBOOK_USER_INFO_URI}

# ==========================================
# OUTLOOK / MICROSOFT OAUTH2 CONFIGURATION
# ==========================================
app.oauth2.outlook.client-id=${OUTLOOK_CLIENT_ID}
app.oauth2.outlook.client-secret=${OUTLOOK_CLIENT_SECRET}
app.oauth2.outlook.redirect-uri=${OUTLOOK_REDIRECT_URI}
app.oauth2.outlook.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
app.oauth2.outlook.user-info-uri=https://graph.microsoft.com/v1.0/me

redis.host = ${REDIS_HOST:localhost}
redis.port = ${REDIS_PORT:6379}

brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}